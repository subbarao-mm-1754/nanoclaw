<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>NanoClaw Chat</title>
    <style>
      :root {
        --bg: #0f1419;
        --surface: #1a2332;
        --border: #2a3544;
        --text: #e7ecf3;
        --muted: #8b9bb0;
        --accent: #3d8bfd;
        --user: #243044;
        --agent: #1e2a38;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: "Segoe UI", system-ui, sans-serif;
        background: var(--bg);
        color: var(--text);
        height: 100vh;
        display: flex;
        flex-direction: column;
      }
      header {
        padding: 0.85rem 1.25rem;
        border-bottom: 1px solid var(--border);
        background: var(--surface);
        display: flex;
        align-items: baseline;
        gap: 0.75rem;
        flex-wrap: wrap;
      }
      header h1 { margin: 0; font-size: 1.05rem; font-weight: 600; }
      header span { color: var(--muted); font-size: 0.85rem; }
      #log {
        flex: 1;
        overflow-y: auto;
        padding: 1.25rem;
        display: flex;
        flex-direction: column;
        gap: 0.75rem;
      }
      .msg {
        max-width: 42rem;
        padding: 0.75rem 1rem;
        border-radius: 10px;
        white-space: pre-wrap;
        word-break: break-word;
        line-height: 1.45;
      }
      .msg.user { align-self: flex-end; background: var(--user); border: 1px solid var(--border); }
      .msg.agent { align-self: flex-start; background: var(--agent); border: 1px solid var(--border); }
      .msg.error { align-self: stretch; background: #3a1f24; border: 1px solid #6b3038; color: #ffb4b4; }
      .msg .role {
        display: block;
        font-size: 0.7rem;
        text-transform: uppercase;
        letter-spacing: 0.04em;
        color: var(--muted);
        margin-bottom: 0.35rem;
      }
      form {
        display: flex;
        gap: 0.6rem;
        padding: 1rem 1.25rem;
        border-top: 1px solid var(--border);
        background: var(--surface);
      }
      textarea {
        flex: 1;
        resize: none;
        min-height: 2.75rem;
        max-height: 8rem;
        padding: 0.65rem 0.8rem;
        border-radius: 8px;
        border: 1px solid var(--border);
        background: var(--bg);
        color: var(--text);
        font: inherit;
      }
      textarea:focus { outline: 1px solid var(--accent); }
      button {
        border: 0;
        border-radius: 8px;
        padding: 0 1.1rem;
        background: var(--accent);
        color: #fff;
        font: inherit;
        font-weight: 600;
        cursor: pointer;
      }
      button:disabled { opacity: 0.5; cursor: not-allowed; }
      .empty { margin: auto; color: var(--muted); text-align: center; }
      .warn {
        margin: 0;
        padding: 0.5rem 1.25rem;
        background: #3a3218;
        color: #f0d78c;
        font-size: 0.85rem;
        border-bottom: 1px solid #5a4a20;
      }
      .warn.hidden { display: none; }
    </style>
  </head>
  <body>
    <header>
      <h1>NanoClaw</h1>
      <span id="who">Gateway chat</span>
    </header>
    <p id="ticket-warn" class="warn hidden">
      Open this page from Agent Studio → <strong>Open chat</strong> so commands like /agents use your account.
    </p>
    <div id="log">
      <p class="empty" id="empty">Send a message to your agent. Try /agents or /help.</p>
    </div>
    <form id="form">
      <textarea id="input" rows="1" placeholder="Message…" autofocus></textarea>
      <button type="submit" id="send">Send</button>
    </form>
    <script>
      const TICKET_KEY = 'nc_chat_ticket';
      const log = document.getElementById('log');
      const empty = document.getElementById('empty');
      const form = document.getElementById('form');
      const input = document.getElementById('input');
      const send = document.getElementById('send');
      const who = document.getElementById('who');
      const ticketWarn = document.getElementById('ticket-warn');

      function readTicketFromUrl() {
        const hash = new URLSearchParams((location.hash || '').replace(/^#/, ''));
        const query = new URLSearchParams(location.search);
        const ticket = (hash.get('ticket') || query.get('ticket') || '').trim();
        if (ticket) {
          sessionStorage.setItem(TICKET_KEY, ticket);
          history.replaceState(null, '', location.pathname);
        }
        return sessionStorage.getItem(TICKET_KEY) || '';
      }

      const ticket = readTicketFromUrl();
      if (ticket) {
        who.textContent = 'Signed in via Agent Studio';
        ticketWarn.classList.add('hidden');
      } else {
        ticketWarn.classList.remove('hidden');
      }

      function addMsg(role, text) {
        if (empty) empty.remove();
        const el = document.createElement('div');
        el.className = 'msg ' + role;
        const label = document.createElement('span');
        label.className = 'role';
        label.textContent = role === 'user' ? 'You' : role === 'error' ? 'Error' : 'Agent';
        el.appendChild(label);
        el.appendChild(document.createTextNode(text));
        log.appendChild(el);
        log.scrollTop = log.scrollHeight;
      }

      form.addEventListener('submit', async (ev) => {
        ev.preventDefault();
        const text = input.value.trim();
        if (!text) return;
        input.value = '';
        addMsg('user', text);
        send.disabled = true;
        try {
          const t = sessionStorage.getItem(TICKET_KEY) || '';
          const res = await fetch('/v1/studio/chat', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ text, ticket: t || undefined }),
          });
          const data = await res.json().catch(() => ({}));
          if (!res.ok) {
            throw new Error(data?.error || 'Request failed (' + res.status + ')');
          }
          const reply = typeof data.reply === 'string' ? data.reply : '';
          if (!reply) throw new Error('Empty agent reply');
          addMsg('agent', reply);
        } catch (err) {
          addMsg('error', err instanceof Error ? err.message : String(err));
        } finally {
          send.disabled = false;
          input.focus();
        }
      });

      input.addEventListener('keydown', (ev) => {
        if (ev.key === 'Enter' && !ev.shiftKey) {
          ev.preventDefault();
          form.requestSubmit();
        }
      });
    </script>
  </body>
</html>
